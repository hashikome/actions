name: Docker secrets
description: Create a product's missing Docker secrets on its server from its encrypted file in hashikome/secrets.
inputs:
  product:
    description: The product's folder in hashikome/secrets, which holds docker-secrets.json.
    required: true
  reader-client-id:
    description: Client ID of the hashikome-secrets-reader GitHub App.
    required: true
  reader-private-key:
    description: Private key of the hashikome-secrets-reader GitHub App.
    required: true
  ssh-key:
    description: Private key of the server's deploy user.
    required: true
  ssh-target:
    description: user@host of the server.
    required: true
  ssh-host-key:
    description: The server's known_hosts line.
    required: true
  workload-identity-provider:
    description: The Google Cloud provider GitHub's OIDC token is exchanged with, for the product's KMS key.
    default: projects/178782815068/locations/global/workloadIdentityPools/github/providers/github-actions
runs:
  using: composite
  steps:
    - name: Token to read hashikome/secrets
      id: reader
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.reader-client-id }}
        private-key: ${{ inputs.reader-private-key }}
        owner: hashikome
        repositories: secrets
    - name: Check out the product's encrypted files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: hashikome/secrets
        token: ${{ steps.reader.outputs.token }}
        path: .hashikome-secrets
        sparse-checkout: ${{ inputs.product }}
        persist-credentials: false
    - name: Google Cloud identity for the product's KMS key
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
    - name: Install SOPS
      shell: bash
      env:
        VERSION: v3.13.3
        SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
      run: |
        mkdir -p "$RUNNER_TEMP/sops"
        curl -fsSL -o "$RUNNER_TEMP/sops/sops" \
          "https://github.com/getsops/sops/releases/download/$VERSION/sops-$VERSION.linux.amd64"
        echo "$SHA256  $RUNNER_TEMP/sops/sops" | sha256sum --check --quiet
        chmod +x "$RUNNER_TEMP/sops/sops"
    - name: Create missing Docker secrets
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
        SOPS: ${{ runner.temp }}/sops/sops
        SECRETS_DIR: ${{ github.workspace }}/.hashikome-secrets
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_TARGET: ${{ inputs.ssh-target }}
        SSH_HOST_KEY: ${{ inputs.ssh-host-key }}
      run: python3 "$GITHUB_ACTION_PATH/ensure_secrets.py"
    - name: Remove the encrypted files
      if: always()
      shell: bash
      run: rm -rf "$GITHUB_WORKSPACE/.hashikome-secrets"
